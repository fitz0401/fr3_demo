[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fr3-demo"
version = "0.1.0"
description = "Safe joystick teleoperation and demonstration collection for Franka Research 3"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "bamboo-franka-client @ git+https://github.com/fitz0401/bamboo.git@f661b3a12a2b38edecf2c0f50052eb957d20372b",
    "numpy>=1.21",
    "tomli>=2; python_version < '3.11'",
]

[project.optional-dependencies]
recording = [
    "evdev>=1.7",
    "Pillow>=10",
    "pyrealsense2==2.55.1.6486",
]
convert = [
    "lerobot @ git+https://github.com/huggingface/lerobot.git@0cf864870cf29f4738d3ade893e6fd13fbd7cdb5",
    "Pillow>=10",
]
pi05 = [
    "msgpack>=1.0.5",
    "Pillow>=10",
    "pyrealsense2==2.55.1.6486",
    "websockets>=14",
]
dev = [
    "pytest>=7",
    "ruff>=0.6",
]

[project.scripts]
fr3-teleop = "fr3_demo.teleop:main"
fr3-collect = "fr3_demo.teleop:collect_main"
fr3-camera-list = "fr3_demo.camera_rviz:list_main"
fr3-camera-rviz = "fr3_demo.camera_rviz:rviz_main"
fr3-annotate = "fr3_demo.annotate:main"
fr3-convert = "fr3_demo.convert_lerobot:main"
fr3-pi05-check = "fr3_pi05.runner:check_main"
fr3-pi05-run = "fr3_pi05.runner:main"

[tool.setuptools.packages.find]
include = ["fr3_demo*", "fr3_pi05*"]

[tool.setuptools.package-data]
fr3_demo = ["config/*.rviz"]
fr3_pi05 = ["config/*.rviz", "remote/*.sh"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
