# Shared settings for fr3-teleop, fr3-collect, and fr3-camera-rviz.
# Command-line arguments can override any value for one run.
version = 1

[robot]
server_ip = "172.16.0.20"
control_port = 5555

[gripper]
port = 5559
type = "robotiq"
enabled = true

[joystick]
device = "/dev/input/js0"
# feedback_event may be added if auto-detection is not desired, for example:
# feedback_event = "/dev/input/event22"

[cameras]
external_serial = "047322071010"
wrist_serial = "309622300781"
fps = 30

[recording]
data_dir = "data/raw"
fps = 15.0

[teleop]
linear_speed = 0.08
angular_speed = 0.35
stream_rate = 30.0
watchdog_ms = 250
max_joint_speed = 0.35
max_joint_acceleration = 1.5
deadzone = 0.12
frame = "base"
command_period = 0.12

[home]
speed = 0.20
timeout = 15.0

[workspace]
min = [0.10, -0.60, 0.05]
max = [0.80, 0.60, 1.00]

# Physical Intelligence pi0.5 DROID inference and guarded execution.
[pi05]
transport = "zmq"
checkpoint = "pi05_droid"
server_host = "10.38.32.253"
server_port = 8000
# "connect": this workstation connects to the GPU. If that inter-subnet path is
# filtered, use "bind" and launch the GPU wrapper with CONNECT_ENDPOINT pointing
# to this workstation (10.34.97.197).
zmq_mode = "connect"
zmq_bind_host = "0.0.0.0"
# Run the official and custom policies independently; select with checkpoint above.
server_ports = { pi05_droid = 8000, custom_droid = 8001 }
control_hz = 15.0
stream_hz = 30.0
open_loop_horizon = 8
prefetch_actions = 4
# Begin conservatively. DROID actions are joint velocities in rad/s.
max_joint_speed = 0.20
max_joint_acceleration = 1.0
joint_margin = 0.10
watchdog_ms = 250
max_camera_age = 0.25
max_inference_age = 3.0
max_rollout_steps = 600
rviz = true
