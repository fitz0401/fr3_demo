# Shared settings for fr3-teleop, fr3-collect, and fr3-camera-rviz.
# Command-line arguments can override any value for one run.
version = 1

[robot]
server_ip = "172.16.0.20"
control_port = 5555

[gripper]
port = 5559
type = "robotiq"
enabled = true
# Normalized Bamboo closing force (0.0 to 1.0).
close_force = 1.0

[joystick]
device = "/dev/input/js0"
# feedback_event may be added if auto-detection is not desired, for example:
# feedback_event = "/dev/input/event22"

[cameras]
external_serial = "047322071010"
wrist_serial = "309622300781"
# Optional second exterior camera. Leave empty to run with the two required cameras.
external2_serial = "f1421698"
external2_width = 960
external2_height = 540
external2_fps = 30
# Pinhao's validated RealSense adaptation: wide 16:9 modes with low transport
# latency. The policy still samples/actions at DROID's 15 Hz control rate.
width = 424
height = 240
fps = 30
# The wrist camera mount is upside-down relative to the DROID hand camera.
wrist_rotate_180 = true

[recording]
data_dir = "data/raw"
fps = 15.0

[teleop]
linear_speed = 0.08
angular_speed = 0.35
stream_rate = 30.0
watchdog_ms = 250
max_joint_speed = 0.35
max_joint_acceleration = 1.5
deadzone = 0.12
frame = "base"
command_period = 0.12

[home]
speed = 0.20
timeout = 15.0

[workspace]
min = [-0.50, -0.5, 0.03]
max = [1.00, 1.50, 1.00]

# Physical Intelligence pi0.5 DROID inference and guarded execution.
[pi05]
transport = "zmq"
# Enable only for a checkpoint trained with exterior_image_2_left.
use_external2 = true
# Contract profile; GPU weight paths are selected by the server launcher.
checkpoint = "wine_hybrid"
# Dedicated inference LAN: GPU enp103s0 ↔ robot workstation eno1.
server_host = "172.16.0.30"
server_port = 8002
# "connect": this workstation connects to the GPU. If that inter-subnet path is
# filtered, use "bind" and launch the GPU wrapper with CONNECT_ENDPOINT pointing
# to this workstation.
zmq_mode = "connect"
zmq_bind_host = "0.0.0.0"
# Run one policy at a time; each profile has a stable workstation endpoint.
server_ports = { pi05_droid = 8000, custom_droid = 8001, wine_hybrid = 8002 }
control_hz = 15.0
stream_hz = 30.0
open_loop_horizon = 15
prefetch_actions = 4
# Model gripper action must be above this value to request open; otherwise close.
gripper_threshold = 0.9
# Match the controller envelope used while collecting the wine demonstrations.
# Workspace and joint-limit prediction remain active for every policy action.
max_joint_speed = 0.35
max_joint_acceleration = 1.5
joint_margin = 0.08
watchdog_ms = 250
max_camera_age = 0.25
max_inference_age = 3.0
# 0 disables the duration limit; stop with joystick Back, Ctrl+C, or E-stop.
max_rollout_steps = 0
rviz = true
