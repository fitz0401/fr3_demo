# Shared settings for fr3-teleop, fr3-collect, and fr3-camera-rviz.
# Command-line arguments can override any value for one run.
version = 1

[robot]
server_ip = "172.16.0.20"
control_port = 5555

[gripper]
port = 5559
type = "robotiq"
enabled = true
# Normalized Bamboo closing force (0.0 to 1.0).
close_force = 1.0

[joystick]
device = "/dev/input/js0"
# feedback_event may be added if auto-detection is not desired, for example:
# feedback_event = "/dev/input/event22"

[cameras]
external_serial = "047322071010"
wrist_serial = "309622300781"
# Optional second exterior camera. Leave empty to run with the two required cameras.
external2_serial = "f1421698"
# The L515 has no RGB mode below 960x540; it does sustain 60 fps there.
external2_width = 960
external2_height = 540
external2_fps = 60
# Pinhao's validated RealSense adaptation: wide 16:9 modes with low transport
# latency. The policy still samples/actions at DROID's 15 Hz control rate.
# 60 fps halves the phase error between free-running cameras: nearest-frame
# selection lands within +-8.3 ms of the target instead of +-16.7 ms, which
# roughly halves inter-camera skew. 424x240 is the only 60 fps mode the wrist
# D456 offers.
width = 424
height = 240
fps = 60
# Image-only transforms; these do not change robot motion axes.
external_rotate_180 = false
wrist_rotate_180 = true
external2_rotate_180 = true

[recording]
data_dir = "data/raw"
fps = 15.0
# Synchronized collection: all streams are aligned to Ubuntu monotonic time.
# 80 ms covers the measured USB delivery tail of the L515 without changing the
# timestamp assigned to a frame; it only delays when an aligned row is emitted.
alignment_delay_ms = 80.0
# Tightened for 60 fps capture, where the worst possible pair skew is 16.7 ms
# rather than 33.3 ms. Loosen these again if the cameras drop back to 30 fps.
camera_max_delta_ms = 15.0
camera_pair_warn_ms = 12.0
camera_pair_reject_ms = 25.0
robot_sample_hz = 60.0
robot_max_gap_ms = 30.0
gripper_sample_hz = 30.0
# The gripper server can be busy during a blocking close/open command.
gripper_max_age_ms = 2000.0
# JPEG compression runs outside the acquisition/alignment threads.
image_workers = 3
image_queue_size = 120
# Stored JPEG size. DROID uses 320x180 and the LeRobot conversion resizes to it,
# so recording larger only costs disk (about 3.5x here). Set both to 0 to keep
# the native camera resolution.
image_width = 320
image_height = 180
# Refuse to start a session, or a new episode, below this much free disk.
min_free_gb = 5.0
# Live RViz view of every camera while collecting. The recorder owns the
# RealSense handles, so this republishes its frames instead of reopening them;
# fr3-camera-rviz cannot run at the same time.
preview = true
preview_rate_hz = 10.0

[teleop]
linear_speed = 0.08
angular_speed = 0.35
stream_rate = 30.0
watchdog_ms = 250
max_joint_speed = 0.35
max_joint_acceleration = 1.5
deadzone = 0.12
frame = "base"
command_period = 0.12

[home]
speed = 0.20
timeout = 15.0

[workspace]
min = [-0.50, -0.5, 0.03]
max = [1.00, 1.50, 1.00]

# Physical Intelligence pi0.5 DROID inference and guarded execution.
[pi05]
transport = "zmq"
# Enable only for a checkpoint trained with exterior_image_2_left.
use_external2 = true
# Contract profile; GPU weight paths are selected by the server launcher.
checkpoint = "wine_hybrid"
# Dedicated inference LAN: GPU enp103s0 ↔ robot workstation eno1.
server_host = "172.16.0.30"
server_port = 8002
# "connect": this workstation connects to the GPU. If that inter-subnet path is
# filtered, use "bind" and launch the GPU wrapper with CONNECT_ENDPOINT pointing
# to this workstation.
zmq_mode = "connect"
zmq_bind_host = "0.0.0.0"
# Run one policy at a time; each profile has a stable workstation endpoint.
server_ports = { pi05_droid = 8000, custom_droid = 8001, wine_hybrid = 8002 }
control_hz = 15.0
stream_hz = 30.0
open_loop_horizon = 15
prefetch_actions = 4
# Model gripper action must be above this value to request open; otherwise close.
gripper_threshold = 0.5
# Match the controller envelope used while collecting the wine demonstrations.
# Workspace and joint-limit prediction remain active for every policy action.
max_joint_speed = 0.35
max_joint_acceleration = 1.5
joint_margin = 0.08
watchdog_ms = 250
max_camera_age = 0.25
max_inference_age = 3.0
# 0 disables the duration limit; stop with joystick Back, Ctrl+C, or E-stop.
max_rollout_steps = 0
rviz = true
